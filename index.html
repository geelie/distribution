      <p class="text-sm text-slate-500 mb-3">Se cere: ${esc(l.categorie || "—")}${l.marca ? " · " + esc(l.marca) : ""}${l.model ? " · " + esc(l.model) : ""}${l.culoare ? " · " + esc(l.culoare) : ""}</p>
      <input type="text" id="pick-produs-search" class="${inputBase()} mb-3" placeholder="Caută după categorie, marcă, model, culoare, VIN...">
      <div id="pick-produs-list" class="space-y-1.5 max-h-72 overflow-y-auto"></div>
      <button type="button" id="pick-produs-cancel" class="w-full mt-4 rounded-lg py-2.5 text-sm font-medium border" style="border-color:var(--line)">Anulează</button>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("pick-produs-cancel")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const listEl = document.getElementById("pick-produs-list");
        function paint(filterQ) {
          const q = (filterQ || "").trim().toLowerCase();
          const filtered = !q
            ? available
            : available.filter((p) =>
                [p.categorie, p.marca, p.model, p.culoare, p.vin, p.id_produs]
                  .filter(Boolean)
                  .some((v) => v.toLowerCase().includes(q)),
              );
          if (!filtered.length) {
            listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Niciun produs disponibil în stoc.</p>`;
            return;
          }
          listEl.innerHTML = filtered
            .map(
              (p) => `
      <button type="button" data-pick="${p.id}" class="pick-produs-item w-full text-left border rounded-lg px-3 py-2 text-sm hover:bg-slate-50" style="border-color:var(--line)">
        <div class="font-medium">${esc(p.categorie || "—")} · ${esc(p.marca || "—")} · ${esc(p.model || "—")} · ${esc(p.culoare || "—")}</div>
        <div class="text-xs text-slate-400 font-mono">${esc(p.id_produs)}${p.vin ? " · VIN " + esc(p.vin) : ""}</div>
        <div class="text-xs mt-1">C.I.V.: ${p.civ ? '<span class="inline-block px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-indigo-100 text-indigo-700">Da</span>' : '<span class="text-slate-400">Nu</span>'}</div>
      </button>`,
            )
            .join("");
          listEl.querySelectorAll(".pick-produs-item").forEach((btn) => {
            btn.addEventListener("click", () => {
              const produs = available.find((p) => p.id === btn.dataset.pick);
              overlay.remove();
              onPick(produs);
            });
          });
        }
        paint("");
        document
          .getElementById("pick-produs-search")
          .addEventListener("input", (e) => paint(e.target.value));
      }

      function comandaLineRow(l, context) {
        const produs = l.produs_id
          ? context.produse.find((p) => p.id === l.produs_id)
          : null;

        const canManageStock =
          currentProfile.role === "admin" ||
          currentProfile.role === "superadmin";
        const canManageLines =
          canManageStock || currentProfile.role === "agent";

        const arePeStoc = !produs && !!findMatchingStockProduct(l, context);
        const statusText = arePeStoc
          ? "Pe stoc"
          : lineStatusLabel(l.status_linie);
        const statusCls = arePeStoc
          ? "text-sky-700"
          : l.status_linie === "trimis"
            ? "text-emerald-700"
            : l.status_linie === "realocat"
              ? "text-red-600"
              : l.status_linie === "asignat"
                ? "text-blue-700"
                : "text-amber-700";
        return `
  <div class="border rounded-lg p-2 flex items-center justify-between flex-wrap" style="border-color:var(--line);gap:.25rem .75rem" data-linie="${l.id}">
    <div class="text-sm min-w-0">
      <div class="font-medium flex items-center flex-wrap gap-2">
        <span>${esc(l.categorie || "—")}${l.marca ? " · " + esc(l.marca) : ""}${l.model ? " · " + esc(l.model) : ""}${l.culoare ? " · " + esc(l.culoare) : ""}</span>
        ${
          produs
            ? `<span class="text-xs text-slate-500 font-normal">C.I.V.: ${produs.civ ? '<span class="text-indigo-700 font-semibold">Da</span>' : '<span class="text-slate-400">Nu</span>'} · Preț: ${produs.pret_cu_tva !== null && produs.pret_cu_tva !== undefined ? fmtNum(produs.pret_cu_tva) + " lei" : "—"}</span>`
            : ""
        }
      </div>
      ${
        produs && l.status_linie === "trimis"
          ? `<div class="text-xs text-emerald-700 mt-0.5">ID produs: ${canManageStock ? `<button type="button" data-edit-produs-line="${l.id}" class="underline decoration-dotted hover:text-[var(--teal-dark)]" title="Deschide și editează datele produsului">${esc(produs.id_produs)}</button>` : esc(produs.id_produs)}${produs.vin ? " · VIN " + esc(produs.vin) : ""}</div>`
          : ""
      }
    </div>
    <div class="flex items-center gap-2">
      <div class="flex flex-col items-end">
        <span class="text-xs font-medium ${statusCls}">${esc(statusText)}</span>
        ${
          l.status_linie === "trimis" && l.data_trimis
            ? `<span class="text-[10px] text-slate-400 leading-tight">${new Date(l.data_trimis).toLocaleDateString("ro-RO")}</span>`
            : ""
        }
      </div>
      ${
        l.status_linie === "trimis"
          ? ""
          : `${
              canManageStock
                ? `<button data-link-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border" style="border-color:var(--line)">${produs ? "Schimbă produsul" : "Leagă produs"}</button>
             <button data-newprod-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200">+ Produs nou</button>
             ${
               l.status_linie === "asignat"
                 ? `<button data-unlink-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border text-amber-700" style="border-color:var(--line)">Anulează legătura</button>`
                 : ""
             }`
                : ""
            }
             ${
               canManageLines
                 ? `<button data-delete-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border text-red-600" style="border-color:var(--line)" title="Șterge acest produs din comandă">Șterge</button>`
                 : ""
             }`
      }
    </div>
  </div>`;
      }

      function bindComandaLineRow(
        l,
        context,
        paintLines,
        overlay,
        agenti,
        lines,
      ) {
        const row = overlay.querySelector(`[data-linie="${l.id}"]`);
        if (!row) return;
        const linkBtn = row.querySelector(`[data-link-line="${l.id}"]`);
        if (linkBtn) {
          linkBtn.addEventListener("click", () => {
            renderPickProductModal(l, context, async (produs) => {
              await supa
                .from("comanda_produse")
                .update({ produs_id: produs.id, status_linie: "asignat" })
                .eq("id", l.id);
              l.produs_id = produs.id;
              l.status_linie = "asignat";
              inregistreazaLog(
                "comanda",
                l.comanda_id,
                "Asignare produs existent",
                `ID produs: ${produs.id_produs}`,
              );
              if (lines) syncComandaStatus(l.comanda_id, lines);
              paintLines();
            });
          });
        }
        const newProdBtn = row.querySelector(`[data-newprod-line="${l.id}"]`);
        if (newProdBtn) {
          newProdBtn.addEventListener("click", () => {
            renderAddProductModal(
              agenti,
              () => {},
              async (produsNou) => {
                await supa
                  .from("comanda_produse")
                  .update({ produs_id: produsNou.id, status_linie: "asignat" })
                  .eq("id", l.id);
                l.produs_id = produsNou.id;
                l.status_linie = "asignat";
                context.produse.push(produsNou);
                inregistreazaLog(
                  "comanda",
                  l.comanda_id,
                  "Asignare produs nou",
                  `ID produs: ${produsNou.id_produs}`,
                );
                if (lines) syncComandaStatus(l.comanda_id, lines);
                paintLines();
              },
              {
                categorie: l.categorie,
                marca: l.marca,
                model: l.model,
                culoare: l.culoare,
              },
              distinctMarci(context.produse),
              distinctModele(context.produse),
            );
          });
        }
        const unlinkBtn = row.querySelector(`[data-unlink-line="${l.id}"]`);
        if (unlinkBtn) {
          unlinkBtn.addEventListener("click", async () => {
            const ok = confirm(
              "Anulezi legătura acestui produs cu comanda? Produsul va reveni la statusul „Neasignat”.",
            );
            if (!ok) return;
            await supa
              .from("comanda_produse")
              .update({ produs_id: null, status_linie: "neasignat" })
              .eq("id", l.id);
            const produsDeslegat = context.produse.find(
              (p) => p.id === l.produs_id,
            );
            inregistreazaLog(
              "comanda",
              l.comanda_id,
              "Deslegare produs din linie",
              produsDeslegat ? `ID produs: ${produsDeslegat.id_produs}` : null,
            );
            l.produs_id = null;
            l.status_linie = "neasignat";
            if (lines) syncComandaStatus(l.comanda_id, lines);
            paintLines();
          });
        }
        const editProdusBtn = row.querySelector(
          `[data-edit-produs-line="${l.id}"]`,
        );
        if (editProdusBtn) {
          editProdusBtn.addEventListener("click", () => {
            const produs = context.produse.find((p) => p.id === l.produs_id);
            if (!produs) return;
            renderEditProductModal(
              produs,
              context.agenti || [],
              context.magazine || [],
              () => paintLines(),
              context.marci || [],
              context.modele || [],
              undefined,
              null,
              false,
            );
          });
        }
        const deleteBtn = row.querySelector(`[data-delete-line="${l.id}"]`);
        if (deleteBtn && lines) {
          deleteBtn.addEventListener("click", async () => {
            const ok = confirm(
              "Ștergi acest produs din comandă? Acțiunea nu poate fi anulată.",
            );
            if (!ok) return;
            await supa.from("comanda_produse").delete().eq("id", l.id);
            inregistreazaLog(
              "comanda",
              l.comanda_id,
              "Ștergere linie din comandă",
              `${l.categorie || "—"}${l.marca ? " · " + l.marca : ""}${l.model ? " · " + l.model : ""}${l.culoare ? " · " + l.culoare : ""}`,
            );
            const idx = lines.findIndex((x) => x.id === l.id);
            if (idx >= 0) lines.splice(idx, 1);
            syncComandaStatus(l.comanda_id, lines);
            paintLines();
          });
        }
      }

      function renderComandaDetailModal(c, lines, context, onSaved) {
        const overlay = document.createElement("div");
        overlay.id = "comanda-detail-overlay";
        overlay.className =
          "fixed inset-0 z-40 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";

        const m = context.magazine.find((x) => x.id === c.magazin_id);
        const magazinLabel = magazinLabelPentru(
          c.magazin_id,
          context.magazine,
          c.vanzare_directa,
        );

        const isStockManager =
          currentProfile.role === "admin" ||
          currentProfile.role === "superadmin";
        const canManageLines =
          isStockManager || currentProfile.role === "agent";

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-3xl fade-in my-auto">
      <div class="flex items-start justify-between mb-1">
        <div class="flex items-center gap-2">
          <h2 class="text-lg font-bold">${esc(c.numar_comanda)}</h2>
          ${isStockManager ? logButtonHtml("comanda-detail-log-btn") : ""}
        </div>
        <button id="comanda-detail-close" class="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
      </div>
      <p class="text-sm text-slate-500 mb-1">Magazin: <strong>${esc(magazinLabel)}</strong> · Agent: ${esc(c.agent || "—")}</p>
      <p class="text-xs text-slate-400 mb-1">Creat la: ${c.created_at ? new Date(c.created_at).toLocaleDateString("ro-RO") : "—"} · Termen de plată: ${c.termen_plata ? c.termen_plata + " zile" : "—"}</p>
      ${c.observatii ? `<p class="text-xs text-slate-400 mb-3">Observații: ${esc(c.observatii)}</p>` : ""}
      <div id="comanda-lines-detail-scroll" class="overflow-y-auto my-3" style="max-height:22rem">
        <div id="comanda-lines-detail" class="space-y-0.5"></div>
      </div>
      <div id="comanda-adauga-produs-wrap">
      ${
        canManageLines
          ? `<button type="button" id="comanda-adauga-produs" class="text-xs font-medium underline mb-3" style="color:var(--teal-dark)">+ Adaugă produs</button>`
          : ""
      }
      </div>
      ${
        isStockManager
          ? `<div class="flex gap-2 pt-2 border-t flex-wrap" style="border-color:var(--line)">
        <button id="comanda-trimite" class="btn-primary rounded-lg py-2.5 px-5 text-sm">Trimite produsele pregătite</button>
        <button id="comanda-anuleaza" class="ml-auto rounded-lg py-2.5 px-4 text-sm font-medium border text-red-600" style="border-color:var(--line)">Anulează comanda</button>
        ${
          currentProfile.role === "superadmin"
            ? `<button id="comanda-sterge" class="rounded-lg py-2.5 px-4 text-sm font-medium border text-red-700" style="border-color:var(--line)">Șterge definitiv</button>`
            : c.stergere_ceruta
              ? `<button disabled class="rounded-lg py-2.5 px-4 text-sm font-medium border text-slate-400" style="border-color:var(--line)">Ștergere solicitată</button>`
              : `<button id="comanda-cere-stergere" class="rounded-lg py-2.5 px-4 text-sm font-medium border text-red-600" style="border-color:var(--line)">Solicită ștergere</button>`
        }
      </div>`
          : ""
      }
      <p id="comanda-detail-msg" class="text-sm text-center mt-2"></p>
      ${
        isStockManager
          ? `<div class="mt-4 pt-3 border-t" style="border-color:var(--line)">
        <button type="button" id="comanda-achitare-toggle" class="flex items-center gap-1 text-xs font-semibold text-slate-500 mb-2">
          <span id="comanda-achitare-toggle-icon">+</span> Achitare
        </button>
        <div id="comanda-achitare-body" class="hidden">
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <button type="button" data-plata="integral" class="plata-btn rounded-md px-3 py-1.5 text-xs font-medium border ${c.stadiu_plata === "integral" ? "btn-primary" : ""}" style="border-color:var(--line)">Achitat integral</button>
          <button type="button" data-plata="partial" class="plata-btn rounded-md px-3 py-1.5 text-xs font-medium border ${c.stadiu_plata === "partial" ? "btn-primary" : ""}" style="border-color:var(--line)">Achitat parțial</button>
        </div>
        <div id="comanda-suma-achitata-wrap" class="mb-2 max-w-[12rem] ${c.stadiu_plata === "partial" ? "" : "hidden"}">
          ${fieldLabel("Sumă achitată (lei)")}
          <input type="number" id="comanda-suma-achitata" min="0" step="0.01" value="${c.suma_achitata ?? ""}" class="${inputBase()}">
        </div>
        <div class="mb-2">
          ${fieldLabel("Detalii de plată")}
          <input type="text" id="comanda-detalii-plata" value="${esc(c.detalii_plata || "")}" placeholder="Nr. ordin de plată, etc." class="${inputBase()}">
        </div>
        <button type="button" id="comanda-salveaza-plata" class="btn-primary rounded-lg py-2 px-4 text-sm">Salvează achitarea</button>
        <p id="comanda-plata-msg" class="text-xs mt-1"></p>
        </div>
      </div>`
          : ""
      }
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("comanda-detail-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const comandaDetailLogBtn = document.getElementById(
          "comanda-detail-log-btn",
        );
        if (comandaDetailLogBtn) {
          comandaDetailLogBtn.addEventListener("click", () => {
            renderLogModal("comanda", c.id, c.numar_comanda);
          });
        }

        const achitareToggleBtn = document.getElementById(
          "comanda-achitare-toggle",
        );
        if (achitareToggleBtn) {
          achitareToggleBtn.addEventListener("click", () => {
            const body = document.getElementById("comanda-achitare-body");
            const icon = document.getElementById(
              "comanda-achitare-toggle-icon",
            );
            const isHidden = body.classList.toggle("hidden");
            icon.textContent = isHidden ? "+" : "-";
          });
        }

        const linesEl = document.getElementById("comanda-lines-detail");
        const addProdusWrap = document.getElementById(
          "comanda-adauga-produs-wrap",
        );
        function paintLines() {
          linesEl.innerHTML = lines.length
            ? lines.map((l) => comandaLineRow(l, context)).join("")
            : `<p class="text-sm text-slate-400 text-center py-4">Nicio linie de produs în această comandă.</p>`;
          lines.forEach((l) =>
            bindComandaLineRow(
              l,
              context,
              paintLines,
              overlay,
              context.agenti,
              lines,
            ),
          );

          const comandaEsteOnorata =
            lines.length > 0 && computeComandaStatus(lines) === "onorata";
          if (addProdusWrap)
            addProdusWrap.style.display = comandaEsteOnorata ? "none" : "";
        }
        paintLines();

        const addLinieBtn = document.getElementById("comanda-adauga-produs");
        if (addLinieBtn) {
          addLinieBtn.addEventListener("click", () => {
            renderAddLinieComandaModal(
              context.marci,
              context.modele,
              context.marcaCategorieMap,
              async (lineData) => {
                const { data: linieNoua, error } = await supa
                  .from("comanda_produse")
                  .insert({
                    comanda_id: c.id,
                    categorie: lineData.categorie,
                    marca: lineData.marca,
                    model: lineData.model,
                    culoare: lineData.culoare,
                    cantitate: lineData.cantitate,
                    status_linie: "neasignat",
                  })
                  .select()
                  .single();
                if (error) {
                  toast("Eroare la adăugarea produsului: " + error.message);
                  return;
                }
                lines.push(linieNoua);
                inregistreazaLog(
                  "comanda",
                  c.id,
                  "Adăugare produs în comandă",
                  `${lineData.categorie || "—"}${lineData.marca ? " · " + lineData.marca : ""}${lineData.model ? " · " + lineData.model : ""}${lineData.culoare ? " · " + lineData.culoare : ""} (cant. ${lineData.cantitate})`,
                );
                syncComandaStatus(c.id, lines);
                paintLines();
              },
            );
          });
        }

        const btnTrimite = document.getElementById("comanda-trimite");
        if (btnTrimite)
          btnTrimite.addEventListener("click", async () => {
            const readyLines = lines.filter(
              (l) => l.status_linie === "asignat",
            );
            const msg = document.getElementById("comanda-detail-msg");
            if (!readyLines.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Nu există produse pregătite de trimis.";
              return;
            }
            const btn = document.getElementById("comanda-trimite");
            btn.disabled = true;
            btn.textContent = "Se trimite...";

            for (const l of readyLines) {
              const produs = context.produse.find((p) => p.id === l.produs_id);
              if (!produs) continue;
              const payload = {
                magazin_id: c.magazin_id,
                agent: c.agent,
                telefon: m ? m.telefon || null : null,
                adresa_facturare: m ? m.adresa_facturare || null : null,
                vanzare_directa: !!c.vanzare_directa,
                updated_at: new Date().toISOString(),
              };
              if (!produs.data_comenzii) {
                payload.data_comenzii = new Date().toISOString().slice(0, 10);
              }
              await supa.from("produse").update(payload).eq("id", produs.id);
              const dataTrimis = new Date().toISOString();
              await supa
                .from("comanda_produse")
                .update({ status_linie: "trimis", data_trimis: dataTrimis })
                .eq("id", l.id);
              l.status_linie = "trimis";
              l.data_trimis = dataTrimis;
              Object.assign(produs, payload);
            }

            const newStatus = computeComandaStatus(lines);
            await supa
              .from("comenzi")
              .update({
                status: newStatus,
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);

            toast("Produsele pregătite au fost trimise către magazin.");
            inregistreazaLog(
              "comanda",
              c.id,
              "Trimitere produse către magazin",
              `${readyLines.length} produs${readyLines.length === 1 ? "" : "e"} trimis${readyLines.length === 1 ? "" : "e"}`,
            );
            overlay.remove();
            onSaved();
          });

        const btnAnuleaza = document.getElementById("comanda-anuleaza");
        if (btnAnuleaza)
          btnAnuleaza.addEventListener("click", async () => {
            const ok = confirm(`Anulezi definitiv comanda ${c.numar_comanda}?`);
            if (!ok) return;
            await supa
              .from("comenzi")
              .update({
                status: "anulata",
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);
            toast("Comanda a fost anulată.");
            inregistreazaLog("comanda", c.id, "Anulare comandă");
            overlay.remove();
            onSaved();
          });

        const btnSterge = document.getElementById("comanda-sterge");
        if (btnSterge) {
          btnSterge.addEventListener("click", async () => {
            const ok1 = confirm(
              `Ești sigur că vrei să ștergi definitiv comanda ${c.numar_comanda}? Această acțiune nu poate fi anulată.`,
            );
            if (!ok1) return;
            const ok2 = confirm(
              "Confirmă din nou: comanda și toate liniile ei vor fi șterse definitiv.",
            );
            if (!ok2) return;
            inregistreazaLog(
              "comanda",
              c.id,
              "Ștergere definitivă",
              `Nr. comandă: ${c.numar_comanda}`,
            );
            await supa.from("comanda_produse").delete().eq("comanda_id", c.id);
            await supa.from("comenzi").delete().eq("id", c.id);
            toast("Comanda a fost ștearsă definitiv.");
            overlay.remove();
            onSaved();
          });
        }

        const btnCereStergere = document.getElementById(
          "comanda-cere-stergere",
        );
        if (btnCereStergere) {
          btnCereStergere.addEventListener("click", async () => {
            const ok = confirm(
              `Soliciți ștergerea comenzii ${c.numar_comanda}? Cererea va fi trimisă spre aprobare unui Super admin.`,
            );
            if (!ok) return;
            await supa
              .from("comenzi")
              .update({
                stergere_ceruta: true,
                stergere_ceruta_de: currentProfile.nume || currentProfile.email,
                stergere_ceruta_la: new Date().toISOString(),
              })
              .eq("id", c.id);
            toast("Solicitarea de ștergere a fost trimisă spre aprobare.");
            inregistreazaLog("comanda", c.id, "Solicitare ștergere comandă");
            overlay.remove();
            onSaved();
          });
        }

        let stadiuPlataSelectat = c.stadiu_plata || null;
        const plataBtns = overlay.querySelectorAll(".plata-btn");
        const sumaAchitataWrap = document.getElementById(
          "comanda-suma-achitata-wrap",
        );
        plataBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            stadiuPlataSelectat = btn.dataset.plata;
            plataBtns.forEach((b) =>
              b.classList.toggle("btn-primary", b === btn),
            );
            if (sumaAchitataWrap)
              sumaAchitataWrap.classList.toggle(
                "hidden",
                stadiuPlataSelectat !== "partial",
              );
          });
        });
        const btnSalveazaPlata = document.getElementById(
          "comanda-salveaza-plata",
        );
        if (btnSalveazaPlata) {
          btnSalveazaPlata.addEventListener("click", async () => {
            const plataMsg = document.getElementById("comanda-plata-msg");
            if (!stadiuPlataSelectat) {
              plataMsg.className = "text-xs mt-1 text-red-600";
              plataMsg.textContent =
                "Alege stadiul achitării (integral sau parțial).";
              return;
            }
            const sumaInput = document.getElementById("comanda-suma-achitata");
            const sumaVal =
              sumaInput && sumaInput.value.trim() !== ""
                ? parseFloat(sumaInput.value)
                : null;
            if (
              stadiuPlataSelectat === "partial" &&
              (sumaVal === null || isNaN(sumaVal))
            ) {
              plataMsg.className = "text-xs mt-1 text-red-600";
              plataMsg.textContent = "Completează suma achitată parțial.";
              return;
            }
            const detaliiVal =
              document.getElementById("comanda-detalii-plata").value.trim() ||
              null;
            btnSalveazaPlata.disabled = true;
            btnSalveazaPlata.textContent = "Se salvează...";
            const { error: plataErr } = await supa
              .from("comenzi")
              .update({
                stadiu_plata: stadiuPlataSelectat,
                suma_achitata:
                  stadiuPlataSelectat === "partial" ? sumaVal : null,
                detalii_plata: detaliiVal,
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);
            if (plataErr) {
              plataMsg.className = "text-xs mt-1 text-red-600";
              plataMsg.textContent = plataErr.message;
              btnSalveazaPlata.disabled = false;
              btnSalveazaPlata.textContent = "Salvează achitarea";
              return;
            }
            toast("Informațiile de achitare au fost salvate.");
            inregistreazaLog(
              "comanda",
              c.id,
              "Actualizare achitare",
              plataStadiuLabel({
                stadiu_plata: stadiuPlataSelectat,
                suma_achitata: sumaVal,
              }),
            );
            overlay.remove();
            onSaved();
          });
        }
      }

      async function loadStocMagazinPagina(magazinId, pageKey, doarNevandute) {
        const { from, to } = rangeFor(pageKey);
        let q = supa
          .from("produse")
          .select("*", { count: "exact" })
          .eq("magazin_id", magazinId)
          .order("created_at", { ascending: true })
          .range(from, to);
        if (doarNevandute) q = q.eq("vandut", false);
        const { data: produse, error, count } = await q;
        if (error) return { error };

        const produsIds = (produse || []).map((p) => p.id);
        const { data: liniiProduse, error: liniiProduseErr } = produsIds.length
          ? await supa
              .from("comanda_produse")
              .select("*")
              .in("produs_id", produsIds)
              .eq("status_linie", "trimis")
          : { data: [] };
        if (liniiProduseErr) return { error: liniiProduseErr };
        const comandaIds = Array.from(
          new Set(
            (liniiProduse || []).map((l) => l.comanda_id).filter(Boolean),
          ),
        );
        const [
          { data: linii, error: liniiErr },
          { data: comenzi, error: comErr },
        ] = comandaIds.length
          ? await Promise.all([
              supa
                .from("comanda_produse")
                .select("*")
                .in("comanda_id", comandaIds),
              supa.from("comenzi").select("*").in("id", comandaIds),
            ])
          : [{ data: [] }, { data: [] }];

      const ZILE_CICLU_BATERIE = 15;

      function adaugaZileData(dataISO, zile) {
        const d = new Date(dataISO + "T00:00:00");
        d.setDate(d.getDate() + zile);
        return d.toISOString().slice(0, 10);
      }

      function astaziISO() {
        return new Date().toISOString().slice(0, 10);
      }

      function diferentaZile(dataA, dataB) {
        const a = new Date(dataA + "T00:00:00");
        const b = new Date(dataB + "T00:00:00");
        return Math.round((a - b) / 86400000);
      }

      function calculeazaCicluriBaterie(
        produs,
        toateIncarcarile,
        dataReferinta,
      ) {
        if (!produs.magazin_id || !produs.data_comenzii) return null;

        const ancoraStart = produs.data_comenzii.slice(0, 10);
        const incarcariProdus = (toateIncarcarile || [])
          .filter(
            (i) => i.produs_id === produs.id && i.data_incarcare >= ancoraStart,
          )
          .sort((a, b) => a.data_incarcare.localeCompare(b.data_incarcare));

        const cicluri = [];
        let ancoraCurenta = ancoraStart;
        incarcariProdus.forEach((inc) => {
          const termen = adaugaZileData(ancoraCurenta, ZILE_CICLU_BATERIE);
          const status = inc.data_incarcare <= termen ? "verde" : "rosu";
          cicluri.push({ ...inc, ancora: ancoraCurenta, termen, status });
          ancoraCurenta = inc.data_incarcare;
        });

        const termenCurent = adaugaZileData(ancoraCurenta, ZILE_CICLU_BATERIE);
        const zileDiff = diferentaZile(
          termenCurent,
          dataReferinta || astaziISO(),
        );
        const statusCurent = zileDiff >= 0 ? "verde" : "rosu";

        return {
          ancoraStart,
          cicluri,
          ancoraCurenta,
          termenCurent,
          statusCurent,
          zileDiff,
        };
      }

      function bateriiStatusBadge(statusCurent, zileDiff) {
        if (statusCurent === "rosu") {
          const zz = Math.abs(zileDiff);
          return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-600">🔴 Depășit cu ${zz} zi${zz === 1 ? "" : "le"}</span>`;
        }
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700">🟢 În termen (${zileDiff} zi${zileDiff === 1 ? "" : "le"} rămase)</span>`;
      }

      function rezumatBaterii(produse, incarcari, dataReferinta) {
        let inTermen = 0;
        let depasite = 0;
        let ultimaZi = 0;
        (produse || []).forEach((p) => {
          const c = calculeazaCicluriBaterie(p, incarcari, dataReferinta);
          if (!c) return;
          if (c.statusCurent === "rosu") depasite++;
          else inTermen++;
          if (c.statusCurent === "verde" && c.zileDiff === 0) ultimaZi++;
        });
        return { inTermen, depasite, ultimaZi, total: inTermen + depasite };
      }

      function bateriiRezumatBar(produse, incarcari, filtruActiv) {
        const { inTermen, depasite, total } = rezumatBaterii(
          produse,
          incarcari,
        );
        const activ = filtruActiv || "toate";
        return `
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <button type="button" data-baterii-filtru="toate" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white border transition-shadow ${activ === "toate" ? "ring-2 ring-slate-800" : ""}" style="border-color:var(--line)">
        📦 ${total} produs${total === 1 ? "" : "e"} de urmărit
      </button>
      <button type="button" data-baterii-filtru="termen" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700 border border-transparent transition-shadow ${activ === "termen" ? "ring-2 ring-emerald-600" : ""}">
        🟢 ${inTermen} în termen
      </button>
      <button type="button" data-baterii-filtru="depasit" class="baterii-filtru-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border border-transparent transition-shadow ${depasite > 0 ? "bg-red-50 text-red-600" : "bg-slate-50 text-slate-400"} ${activ === "depasit" ? "ring-2 ring-red-600" : ""}">
        🔴 ${depasite} cu termen depășit
      </button>
    </div>`;
      }

      function filtreazaProduseBaterii(produse, incarcari, filtru) {
        if (filtru === "termen") {
          return (produse || []).filter((p) => {
            const c = calculeazaCicluriBaterie(p, incarcari);
            return c && c.statusCurent === "verde";
          });
        }
        if (filtru === "depasit") {
          return (produse || []).filter((p) => {
            const c = calculeazaCicluriBaterie(p, incarcari);
            return c && c.statusCurent === "rosu";
          });
        }
        return produse || [];
      }

          });
        });
      }

      function bindBateriiTableEvents(

        produse,
        incarcari,
        onIncarcare,

        produse.forEach((p) => {
          const c = calculeazaCicluriBaterie(p, incarcari);

          const identificaBtn = container.querySelector(
            `[data-identifica-produs="${p.id}"]`,
          );
          if (identificaBtn) {
            identificaBtn.addEventListener("click", () =>
              renderIdentificaProdusModal(p),
            );
          }
          const istoricBtn = container.querySelector(
            `[data-istoric-produs="${p.id}"]`,
          );
          if (istoricBtn) {
            istoricBtn.addEventListener("click", () =>
              renderIstoricBaterieModal(p, c),
            );
          }
          if (onIncarcare) {
            const incarcaBtn = container.querySelector(
              `[data-incarca-produs="${p.id}"]`,
            );
            if (incarcaBtn) {
              incarcaBtn.addEventListener("click", () =>
                onIncarcare(p, incarcaBtn),
              );
            }
          }
        });

      const BUCKET_VANZARI = "documente-vanzari";

      async function incarcaDocumentVanzare(produsId, file, tip) {
        const extensie = (file.name.split(".").pop() || "bin").toLowerCase();
        const path = `${produsId}/${tip}_${Date.now()}.${extensie}`;
        const { error } = await supa.storage
          .from(BUCKET_VANZARI)
          .upload(path, file, { upsert: true, contentType: file.type });
        if (error) throw error;
        return path;
      }

      async function obtineUrlSemnatVanzare(path) {
        const { data, error } = await supa.storage
          .from(BUCKET_VANZARI)
          .createSignedUrl(path, 300);
        if (error) throw error;
        return data.signedUrl;
      }

      function bindVanzareButoane(produse, refresh) {
        document.querySelectorAll("[data-vinde-produs]").forEach((btn) => {
          const produs = (produse || []).find(

          btn.addEventListener("click", () => {
            deschideModalVanzareProdus(produs, refresh);
          });

      }

      function deschideModalVanzareProdus(
        produs,
        refresh,
        marcheazaVanzareDirecta,
      ) {
        const overlay = document.createElement("div");
        overlay.id = "vanzare-produs-overlay";
        overlay.className =
          "fixed inset-0 z-40 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";
        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg fade-in my-auto relative">
      <button type="button" id="vanzare-produs-close" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl leading-none" title="Închide">✕</button>
      <h2 class="text-lg font-bold mb-1 pr-6">Vinde produsul ${esc(produs.id_produs)}</h2>
      <p class="text-sm text-slate-500 mb-5">Completează datele clientului final și încarcă documentele obligatorii.</p>
      <form id="form-vanzare-produs" class="space-y-4">
        <div>${fieldLabel("Nume Prenume")}<input type="text" id="vanzare-client-nume" required class="${inputBase()}"></div>
        <div>${fieldLabel("Adresă")}<input type="text" id="vanzare-client-adresa" required class="${inputBase()}"></div>
        <div class="grid grid-cols-2 gap-3">
          <div>${fieldLabel("Telefon")}<input type="text" id="vanzare-client-telefon" required class="${inputBase()}"></div>
          <div>${fieldLabel("Email")}<input type="email" id="vanzare-client-email" required class="${inputBase()}"></div>
        </div>
        <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
          <input type="checkbox" id="vanzare-garantie-extinsa" class="rounded border-slate-300">
          Garanție extinsă
        </label>
        <div>${fieldLabel("Factură")}<input type="file" id="vanzare-file-factura" required accept="application/pdf,image/*" class="${inputBase()} text-slate-600"></div>
        <div>${fieldLabel("P.V. de predare")}<input type="file" id="vanzare-file-pv" required accept="application/pdf,image/*" class="${inputBase()} text-slate-600"></div>
        <div id="vanzare-garantie-file-wrap" class="hidden">${fieldLabel("Garanție extinsă (document)")}<input type="file" id="vanzare-file-garantie" accept="application/pdf,image/*" class="${inputBase()} text-slate-600"></div>
        <div class="flex justify-center pt-1">
          <button type="submit" class="btn-primary rounded-lg py-2.5 px-10 text-sm">Salvează vânzarea</button>
        </div>
        <p id="vanzare-produs-msg" class="text-sm text-center"></p>
      </form>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("vanzare-produs-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const garantieCheckbox = document.getElementById(
          "vanzare-garantie-extinsa",
        );
        const garantieFileWrap = document.getElementById(
          "vanzare-garantie-file-wrap",
        );
        garantieCheckbox.addEventListener("change", () => {
          garantieFileWrap.classList.toggle(
            "hidden",
            !garantieCheckbox.checked,
          );
        });

        document
          .getElementById("form-vanzare-produs")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("vanzare-produs-msg");
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const garantieBifata = garantieCheckbox.checked;
            const fileFactura = document.getElementById("vanzare-file-factura")
              .files[0];
            const filePv = document.getElementById("vanzare-file-pv").files[0];
            const fileGarantie = document.getElementById(
              "vanzare-file-garantie",
            ).files[0];

            if (!fileFactura || !filePv) {
              msg.textContent = "Factura și P.V. de predare sunt obligatorii.";
              msg.className = "text-sm text-center text-red-600";
              return;
            }
            if (garantieBifata && !fileGarantie) {
              msg.textContent =
                "Ai bifat Garanție extinsă — încarcă și documentul aferent.";
              msg.className = "text-sm text-center text-red-600";
              return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Se salvează...";
            msg.textContent = "";

            try {
              const facturaPath = await incarcaDocumentVanzare(
                produs.id,
                fileFactura,
                "factura",
              );
              const pvPath = await incarcaDocumentVanzare(
                produs.id,
                filePv,
                "pv_predare",
              );
              const garantiePath = garantieBifata
                ? await incarcaDocumentVanzare(
                    produs.id,
                    fileGarantie,
                    "garantie_extinsa",
                  )
                : null;

              const { error } = await supa
                .from("produse")
                .update({
                  vandut: true,
                  ...(marcheazaVanzareDirecta ? { vanzare_directa: true } : {}),
                  data_vanzare: new Date().toISOString(),
                  vandut_de: currentUser.id,
                  client_nume: document.getElementById("vanzare-client-nume")
                    .value,
                  client_adresa: document.getElementById(
                    "vanzare-client-adresa",
                  ).value,
                  client_telefon: document.getElementById(
                    "vanzare-client-telefon",
                  ).value,
                  client_email: document.getElementById("vanzare-client-email")
                    .value,
                  garantie_extinsa: garantieBifata,
                  factura_url: facturaPath,
                  pv_predare_url: pvPath,
                  garantie_extinsa_url: garantiePath,
                })
                .eq("id", produs.id);
              if (error) throw error;

              toast("Produsul a fost marcat ca vândut.");
              inregistreazaLog(
                "produs",
                produs.id,
                "Vânzare către client final",
                `ID produs: ${produs.id_produs} · Client: ${document.getElementById("vanzare-client-nume").value}`,
              );
              overlay.remove();
              if (typeof refresh === "function") refresh();
            } catch (err) {
              msg.textContent = "Eroare la salvarea vânzării: " + err.message;
              msg.className = "text-sm text-center text-red-600";
              submitBtn.disabled = false;
              submitBtn.textContent = "Salvează vânzarea";
            }
          });
      }

      async function executaReturProdusVandut(produs, refresh) {
        const ok1 = confirm(
          `Sigur returnezi produsul ${produs.id_produs}? Toate datele vânzării (client, documente) vor fi șterse definitiv, iar produsul va reveni în stoc.`,
        );
        if (!ok1) return;
        const ok2 = confirm(
          "Confirmă din nou: acțiunea este ireversibilă și nu poate fi anulată.",
        );
        if (!ok2) return;

        try {
          const pathuriDocumente = [
            produs.factura_url,
            produs.pv_predare_url,
            produs.garantie_extinsa_url,
          ].filter(Boolean);
          if (pathuriDocumente.length) {
            const { error: delErr } = await supa.storage
              .from(BUCKET_VANZARI)
              .remove(pathuriDocumente);
            if (delErr) throw delErr;
          }

          const payload = {
            vandut: false,
            data_vanzare: null,
            vandut_de: null,
            client_nume: null,
            client_adresa: null,
            client_telefon: null,
            client_email: null,
            garantie_extinsa: false,
            factura_url: null,
            pv_predare_url: null,
            garantie_extinsa_url: null,
            data_ultimului_retur: new Date().toISOString(),
          };
          if (produs.vanzare_directa) payload.vanzare_directa = false;

          const { error } = await supa
            .from("produse")
            .update(payload)
            .eq("id", produs.id);
          if (error) throw error;

          toast("Produsul a fost returnat.");
          inregistreazaLog(
            "produs",
            produs.id,
            "Retur produs vândut",
            `ID produs: ${produs.id_produs}`,
          );
          if (typeof refresh === "function") refresh();
        } catch (err) {
          toast("Eroare la retur: " + err.message, true);
        }
      }

          );

        if (
          currentProfile.role === "admin" ||
          currentProfile.role === "superadmin"
        ) {
          return { all: true, ids: [] };
        }
        if (currentProfile.role === "magazin") {
          return { all: false, ids: [currentUser.id] };

        if (currentProfile.role === "agent") {
          const { data } = await supa

            .eq("agent_id", currentUser.id);
          return { all: false, ids: (data || []).map((a) => a.magazin_id) };

          return {

        return { all: false, ids: [] };

      function presetariPerioadaStatistici() {
        const azi = new Date();
        const iso = (d) => d.toISOString().slice(0, 10);
        const inceputSaptamana = new Date(azi);
        const ziuaSaptamanii = (azi.getDay() + 6) % 7;
        inceputSaptamana.setDate(azi.getDate() - ziuaSaptamanii);
        const inceputLuna = new Date(azi.getFullYear(), azi.getMonth(), 1);
        const inceputLunaTrecuta = new Date(
          azi.getFullYear(),
          azi.getMonth() - 1,
          1,
        );
        const sfarsitLunaTrecuta = new Date(
          azi.getFullYear(),
          azi.getMonth(),
          0,
        );
        const inceputSemestru = new Date(
          azi.getFullYear(),
          azi.getMonth() < 6 ? 0 : 6,
          1,
        );
        const inceputAn = new Date(azi.getFullYear(), 0, 1);
        return [
          {
            key: "saptamana",
            label: "Săptămâna curentă",
            start: iso(inceputSaptamana),
            end: iso(azi),
          },
          {
            key: "luna",
            label: "Luna curentă",
            start: iso(inceputLuna),
            end: iso(azi),
          },
          {
            key: "luna_trecuta",
            label: "Luna trecută",
            start: iso(inceputLunaTrecuta),
            end: iso(sfarsitLunaTrecuta),
          },
          {
            key: "semestru",
            label: "Semestrul curent",
            start: iso(inceputSemestru),
            end: iso(azi),
          },
          {
            key: "an",
            label: "Anul curent",
            start: iso(inceputAn),
            end: iso(azi),
          },
        ];
      }

      async function exportStatisticiExcel(
        meta,
        coloane,
        randuri,
        getValoare,
        randTotal,
      ) {
        const antete = ["Nr. crt.", ...coloane.map((c) => c.label)];
        const randuriDate = randuri.map((r, i) => [
          i + 1,
          ...coloane.map((c) => getValoare(r, c.key)),
        ]);
        const randTotalValori = randTotal
          ? ["", ...coloane.map((c) => randTotal[c.key] || "")]
          : null;

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet(meta.tipLabel.slice(0, 31));

        const toateRandurile = [
          antete,
          ...randuriDate,
          ...(randTotalValori ? [randTotalValori] : []),
        ];
        ws.columns = antete.map((_, idx) => {
          let maxLen = 8;
          toateRandurile.forEach((r) => {
            const len =
              r[idx] === null || r[idx] === undefined
                ? 0
                : String(r[idx]).length;
            if (len > maxLen) maxLen = len;
          });
          return { width: Math.min(maxLen + 2, 45) };
        });

        const bordurConturCelule = {
          top: { style: "thin" },
          left: { style: "thin" },
          bottom: { style: "thin" },
          right: { style: "thin" },
        };
        function stilizeazaRand(row, bold) {
          row.eachCell({ includeEmpty: true }, (cell) => {
            cell.alignment = { horizontal: "center", vertical: "middle" };
            cell.border = bordurConturCelule;
            if (bold) cell.font = { bold: true };
          });
        }

        stilizeazaRand(ws.addRow(antete), true);
        randuriDate.forEach((r) => stilizeazaRand(ws.addRow(r), false));
        if (randTotalValori) stilizeazaRand(ws.addRow(randTotalValori), true);

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Statistici_${meta.tipLabel}_${meta.start}_${meta.end}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

        }

        container.querySelectorAll(".stat-tip-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.tip = btn.dataset.tip;
            renderStatisticiTab(container);
          });
        });
        container.querySelectorAll(".stat-subtip-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const clicked = btn.dataset.subtip;
            if (clicked === "toate") {
              state.subTipuri = ["toate"];
            } else {
              let set = state.subTipuri.filter((s) => s !== "toate");
              if (set.includes(clicked)) {
                set = set.filter((s) => s !== clicked);
              } else {
                set.push(clicked);
              }
              state.subTipuri = set.length ? set : ["toate"];
            }
            renderStatisticiTab(container);
          });
        });
        container.querySelectorAll(".stat-total-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.afiseazaTotal = btn.dataset.total === "da";
            renderStatisticiTab(container);
          });
        });
        container.querySelectorAll(".stat-bool-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const cheie = btn.dataset.bool;
            state[cheie] = !state[cheie];
            renderStatisticiTab(container);
          });
        });

        document
          .getElementById("stat-perioada")
          .addEventListener("change", (e) => {
            const val = e.target.value;
            state.perioada = val;
            if (val) {
              const p = presets.find((x) => x.key === val);
              if (p) {
                state.start = p.start;
                state.end = p.end;
                document.getElementById("stat-start").value = p.start;
                document.getElementById("stat-end").value = p.end;
              }
            }
          });
        document
          .getElementById("stat-start")
          .addEventListener("change", (e) => {
            state.start = e.target.value;
            state.perioada = "";
            document.getElementById("stat-perioada").value = "";
          });
        document.getElementById("stat-end").addEventListener("change", (e) => {
          state.end = e.target.value;
          state.perioada = "";
          document.getElementById("stat-perioada").value = "";
        });

        const resultsEl = document.getElementById("stat-results");
        let ultimulRaport = null; // { meta, coloane, randuri, getValoare }

        async function incarcaSiAfiseaza() {
          resultsEl.innerHTML = `<div class="text-sm text-slate-400">Se calculează...</div>`;

          let idsEfective = scope.all ? null : scope.ids.slice();
          const filtruVanzareDirecta = state.magazinId === "vanzare_directa";
          if (filtruVanzareDirecta) {
            idsEfective = null;
          } else if (state.magazinId) {
            idsEfective = [state.magazinId];
          }

          const termen = tabSearchTerms[currentTabKey] || "";

          if (state.tip === "comenzi") {
            let q = supa.from("comenzi").select("*");
            if (idsEfective) q = q.in("magazin_id", idsEfective);
            if (filtruVanzareDirecta) q = q.eq("vanzare_directa", true);
            if (currentProfile.role === "agent")
              q = q.eq("creat_de", currentUser.id);
            q = q
              .gte("created_at", state.start + "T00:00:00")
              .lte("created_at", state.end + "T23:59:59");
            if (state.agentNume) q = q.ilike("agent", `%${state.agentNume}%`);
            if (state.termenPlata)
              q = q.eq("termen_plata", parseInt(state.termenPlata, 10));
            if (state.stadiuPlata === "neachitat")
              q = q.is("stadiu_plata", null);
            else if (state.stadiuPlata)
              q = q.eq("stadiu_plata", state.stadiuPlata);
            const orFilter = buildSearchOrFilter(termen, [
              "numar_comanda",
              "agent",
              "observatii",
            ]);
            if (orFilter) q = q.or(orFilter);
            q = q.order("created_at", { ascending: false });

            const { data: comenzi, error } = await q;
            if (error) {
              resultsEl.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(error.message)}</div>`;
              return;
            }
            const comenziIds = (comenzi || []).map((c) => c.id);
            const { data: linii } = comenziIds.length
              ? await supa
                  .from("comanda_produse")
                  .select("*")
                  .in("comanda_id", comenziIds)
              : { data: [] };
            const liniiPerComanda = new Map();
            (linii || []).forEach((l) => {
              if (!liniiPerComanda.has(l.comanda_id))
                liniiPerComanda.set(l.comanda_id, []);
              liniiPerComanda.get(l.comanda_id).push(l);
            });

            const coloane = coloaneStatisticiComenzi();
            const getValoare = (c, key) =>
              randValoareComanda(c, toateMagazinele, liniiPerComanda, key);
            const coloaneVizibile = coloaneCuDate(
              coloane,
              comenzi || [],
              getValoare,
            );
            resultsEl.innerHTML = `
      <p class="text-sm text-slate-500 mb-2 shrink-0">${(comenzi || []).length} comand${(comenzi || []).length === 1 ? "ă" : "ă"} găsit${(comenzi || []).length === 1 ? "ă" : "e"} pentru filtrele selectate</p>
      ${tabelStatisticiHtml(coloaneVizibile, comenzi || [], getValoare)}`;

            resultsEl.querySelectorAll(".stat-comanda-link").forEach((el) => {
              el.addEventListener("click", () => {
                const comanda = (comenzi || []).find(
                  (c) => String(c.id) === el.dataset.statComandaId,
                );
                if (comanda) {
                  deschideComandaInitiala(
                    comanda,
                    liniiPerComanda.get(comanda.id) || [],
                    profiles || [],
                  );
                }
              });
            });

            ultimulRaport = {
              meta: {
                tipLabel: "Comenzi",
                start: state.start,
                end: state.end,
                scopLabel: state.magazinId
                  ? magazinLabelDin(magazineFiltruList, state.magazinId)
                  : scope.all
                    ? "Toate magazinele"
                    : "Magazinele mele",
              },
              coloane: coloaneVizibile,
              randuri: comenzi || [],
              getValoare,
            };
            return;
          }

          const coloaneCautare = [
            "id_produs",
            "agent",
            "categorie",
            "marca",
            "culoare",
            "vin",
            "client_nume",
            "client_telefon",
            "client_email",
          ];
          const orFilter = buildSearchOrFilter(termen, coloaneCautare);

          function construiesteQuerySubset(subset) {
            let qs = supa.from("produse").select("*");
            if (subset === "stoc_central") {
              qs = qs.is("magazin_id", null).eq("vandut", false);
              qs = qs
                .gte("created_at", state.start + "T00:00:00")
                .lte("created_at", state.end + "T23:59:59");
            } else if (subset === "stoc_magazine") {
              qs = idsEfective
                ? qs.in("magazin_id", idsEfective)
                : qs.not("magazin_id", "is", null);
              qs = qs.eq("vandut", false);
              qs = qs
                .gte("data_comenzii", state.start)
                .lte("data_comenzii", state.end);
            } else if (subset === "vandute") {
              if (idsEfective) qs = qs.in("magazin_id", idsEfective);
              qs = qs.eq("vandut", true);
              qs = qs
                .gte("data_vanzare", state.start)
                .lte("data_vanzare", state.end);
            } else {
              // toate
              if (idsEfective) qs = qs.in("magazin_id", idsEfective);
              qs = qs
                .gte("created_at", state.start + "T00:00:00")
                .lte("created_at", state.end + "T23:59:59");
            }
            if (state.categorie) qs = qs.eq("categorie", state.categorie);
            if (state.marca) qs = qs.ilike("marca", `%${state.marca}%`);
            if (state.model) qs = qs.ilike("model", `%${state.model}%`);
            if (state.culoare) qs = qs.ilike("culoare", `%${state.culoare}%`);
            if (state.agentNume) qs = qs.ilike("agent", `%${state.agentNume}%`);
            if (state.garantieExtinsa === "da")
              qs = qs.eq("garantie_extinsa", true);
            else if (state.garantieExtinsa === "nu")
              qs = qs.eq("garantie_extinsa", false);
            if (state.civ === "da") qs = qs.eq("civ", true);
            else if (state.civ === "nu") qs = qs.eq("civ", false);
            if (state.returnat && state.relocat) {
              qs = qs.or(
                "data_ultimului_retur.not.is.null,data_ultimei_relocari.not.is.null",
              );
            } else if (state.returnat) {
              qs = qs.not("data_ultimului_retur", "is", null);
            } else if (state.relocat) {
              qs = qs.not("data_ultimei_relocari", "is", null);
            }
            if (filtruVanzareDirecta) qs = qs.eq("vanzare_directa", true);
            if (orFilter) qs = qs.or(orFilter);
            return qs;
          }

          const subseturiActive = state.subTipuri.includes("toate")
            ? ["toate"]
            : state.subTipuri;

          const rezultateSubset = await Promise.all(
            subseturiActive.map((s) => construiesteQuerySubset(s)),
          );
          const eroareProduse = rezultateSubset.find((r) => r.error)?.error;
          if (eroareProduse) {
            resultsEl.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(eroareProduse.message)}</div>`;
            return;
          }
          const produseIdVazute = new Set();
          let produse = [];
          rezultateSubset.forEach((r) => {
            (r.data || []).forEach((p) => {
              if (produseIdVazute.has(p.id)) return;
              produseIdVazute.add(p.id);
              produse.push(p);
            });
          });
          produse.sort((a, b) =>
            (b.created_at || "").localeCompare(a.created_at || ""),
          );

          const coloane = coloaneStatisticiProduse(esteAdmin);
          const getValoare = (p, key) =>
            randValoareProdus(p, toateMagazinele, key);
          const coloaneVizibile = coloaneCuDate(
            coloane,
            produse || [],
            getValoare,
          );
          const randTotal =
            state.afiseazaTotal && (produse || []).length
              ? calculeazaRandTotalProduse(coloaneVizibile, produse || [])
              : null;
          resultsEl.innerHTML = `
      <p class="text-sm text-slate-500 mb-2 shrink-0">${(produse || []).length} produs${(produse || []).length === 1 ? "" : "e"} găsit${(produse || []).length === 1 ? "" : "e"} pentru filtrele selectate</p>
      ${tabelStatisticiHtml(coloaneVizibile, produse || [], getValoare, randTotal)}`;

          ultimulRaport = {
            meta: {
              tipLabel: "Produse",
              start: state.start,
              end: state.end,
              scopLabel: state.magazinId
                ? magazinLabelDin(magazineFiltruList, state.magazinId)
                : scope.all
                  ? "Toate magazinele"
                  : "Magazinele mele",
            },
            coloane: coloaneVizibile,
            randuri: produse || [],
            getValoare,
            randTotal,
          };
        }

        document.getElementById("stat-aplica").addEventListener("click", () => {
          const magInput = document.getElementById("stat-magazin-id");
          if (magInput) state.magazinId = magInput.value;
          state.agentNume = document
            .getElementById("stat-agent-input")
            .value.trim();
          const catSel = document.getElementById("stat-categorie");
          if (catSel) state.categorie = catSel.value;
          const marcaInput = document.getElementById("stat-marca-input");
          if (marcaInput) state.marca = marcaInput.value.trim();
          const modelInput = document.getElementById("stat-model-input");
          if (modelInput) state.model = modelInput.value.trim();
          const culoareInput = document.getElementById("stat-culoare-input");
          if (culoareInput) state.culoare = culoareInput.value.trim();
          const garantieSel = document.getElementById("stat-garantie");
          if (garantieSel) state.garantieExtinsa = garantieSel.value;
          const civSel = document.getElementById("stat-civ");
          if (civSel) state.civ = civSel.value;
          const termenPlataInput = document.getElementById("stat-termen-plata");
          if (termenPlataInput)
            state.termenPlata = termenPlataInput.value.trim();
          const stadiuPlataSel = document.getElementById("stat-stadiu-plata");
          if (stadiuPlataSel) state.stadiuPlata = stadiuPlataSel.value;
          incarcaSiAfiseaza();
        });
        document.getElementById("stat-reset").addEventListener("click", () => {
          statisticiState = statisticiStateImplicit();
          renderStatisticiTab(container);
        });
        document
          .getElementById("stat-export")
          .addEventListener("click", async () => {
            if (!ultimulRaport) {
              toast(
                "Aplică mai întâi filtrele pentru a genera un raport.",
                true,
              );
              return;
            }
            await exportStatisticiExcel(
              ultimulRaport.meta,
              ultimulRaport.coloane,
              ultimulRaport.randuri,
              ultimulRaport.getValoare,
              ultimulRaport.randTotal,
            );
          });

        await incarcaSiAfiseaza();
      }
    </script>
  </body>
</html>
